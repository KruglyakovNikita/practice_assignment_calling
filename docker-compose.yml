services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - auto-calling-db:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: infra/migrate/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-local-only}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service-local-only}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://auto_calling_app:${APP_DB_PASSWORD:-app-local-only}@db:5432/postgres
      DATABASE_SERVICE_URL: postgresql://auto_calling_service:${SERVICE_DB_PASSWORD:-service-local-only}@db:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      CRM_URL: ${CRM_URL}
      PROVIDER_URL: ${PROVIDER_URL}
      CRM_TIMEOUT_MS: ${CRM_TIMEOUT_MS:-1500}
      CRM_MAX_ATTEMPTS: ${CRM_MAX_ATTEMPTS:-8}
      CRM_BATCH_SIZE: ${CRM_BATCH_SIZE:-20}
      CRM_LEASE_MS: ${CRM_LEASE_MS:-15000}
      CRM_POLL_MS: ${CRM_POLL_MS:-1000}
      CRM_RETRY_BASE_MS: ${CRM_RETRY_BASE_MS:-1000}
      CRM_RETRY_MAX_MS: ${CRM_RETRY_MAX_MS:-60000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  auto-calling-db:
