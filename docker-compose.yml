services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # First-run initdb only: skip per-file fsync (on HDD it took ~3 min). The running server keeps
      # fsync on; a crash during that one-time init would just mean re-creating an empty volume.
      POSTGRES_INITDB_ARGS: "--no-sync"
    ports:
      - "54329:5432"
    # TCP probe: the temporary server of the first-run initdb listens on the socket only, so it
    # is not reported healthy before the real server. start_period covers a slow initdb (HDD).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 300s
    volumes:
      - auto-calling-db:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: infra/migrate/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-local-only}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service-local-only}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://auto_calling_app:${APP_DB_PASSWORD:-app-local-only}@db:5432/postgres
      DATABASE_SERVICE_URL: postgresql://auto_calling_service:${SERVICE_DB_PASSWORD:-service-local-only}@db:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      CRM_URL: ${CRM_URL}
      PROVIDER_URL: ${PROVIDER_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DEV_TOOLS: ${DEV_TOOLS:-false}
      CRM_TIMEOUT_MS: ${CRM_TIMEOUT_MS:-10000}
      CRM_MAX_ATTEMPTS: ${CRM_MAX_ATTEMPTS:-20}
      CRM_BATCH_SIZE: ${CRM_BATCH_SIZE:-50}
      CRM_LEASE_MS: ${CRM_LEASE_MS:-30000}
      CRM_POLL_MS: ${CRM_POLL_MS:-1000}
      CRM_RETRY_BASE_MS: ${CRM_RETRY_BASE_MS:-1000}
      CRM_RETRY_MAX_MS: ${CRM_RETRY_MAX_MS:-300000}
      ANALYSIS_POLL_MS: ${ANALYSIS_POLL_MS:-200}
      ANALYSIS_LEASE_MS: ${ANALYSIS_LEASE_MS:-30000}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-4}
      ANALYSIS_PROVIDER_TIMEOUT_MS: ${ANALYSIS_PROVIDER_TIMEOUT_MS:-30000}
      ANALYSIS_PROVIDER_MAX_RETRIES: ${ANALYSIS_PROVIDER_MAX_RETRIES:-3}
      ANALYSIS_RECOVERY_BATCH_SIZE: ${ANALYSIS_RECOVERY_BATCH_SIZE:-20}
      ANALYSIS_SSE_POLL_MS: ${ANALYSIS_SSE_POLL_MS:-150}
    ports:
      - "8080:8080"
    # SIGTERM -> finish in-flight webhooks/CRM sends/analyses before exit (see ASSUMPTIONS).
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

  # Dev stubs, off by default (the checker supplies its own CRM/provider):
  #   PROVIDER_URL=http://mock-provider:18082 CRM_URL=http://mock-crm:18081 docker compose --profile mocks up -d
  mock-provider:
    profiles: ["mocks"]
    build:
      context: ./scripts
      dockerfile_inline: |
        FROM node:22-alpine
        COPY mock-analysis-provider.mjs /app/
        CMD ["node", "/app/mock-analysis-provider.mjs"]

  mock-crm:
    profiles: ["mocks"]
    build:
      context: ./scripts
      dockerfile_inline: |
        FROM node:22-alpine
        COPY mock-crm.mjs /app/
        CMD ["node", "/app/mock-crm.mjs"]

volumes:
  auto-calling-db:
